x-mealmate-invariants:
  - id: WEEK_START_IS_MONDAY
    appliesTo:
      - WeeklyPlanView
      - GenerateWeeklyPlanInput
    owners:
      - server
      - android
      - database
    vectors:
      valid:
        - 2026-07-27
      invalid:
        - 2026-07-26
        - not-a-date
  - id: WEEKLY_PLAN_HAS_21_SLOTS
    appliesTo:
      - WeeklyPlanView
      - GenerateWeeklyPlanInput
    owners:
      - server
      - android
    vectors:
      valid:
        - items:
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
            - null
      invalid:
        - items: []
        - 21
        - items: 21
  - id: SYNC_RESULTS_PRESERVE_INPUT_ORDER
    appliesTo:
      - SyncActionsResponse
    owners:
      - server
      - android
    vectors:
      valid:
        - inputActionIds:
            - a
            - b
          resultActionIds:
            - a
            - b
      invalid:
        - inputActionIds:
            - a
            - b
          resultActionIds:
            - b
            - a
        - inputActionIds:
            - a
          resultActionIds:
            - a
            - b
  - id: SERVER_VERSION_WITHIN_DB_BIGINT
    appliesTo:
      - ServerVersion
    owners:
      - server
      - android
      - database
    vectors:
      valid:
        - "1"
        - "9223372036854775807"
      invalid:
        - "0"
        - "9223372036854775808"
        - "01"
  - id: CONFIRMATION_STATE_FIELDS_MATCH
    appliesTo:
      - ConfirmationEventDto
    owners:
      - server
      - android
    vectors:
      valid:
        - state: pending
          confirmationToken: token-1
        - state: expired
      invalid:
        - state: pending
        - state: consumed
          confirmationToken: token-1
        - state: unknown
components:
  schemas:
    BootstrapRequest:
      type: object
      properties:
        bootstrapSecret:
          type: string
          minLength: 1
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - bootstrapSecret
        - deviceName
      additionalProperties: false
    BootstrapResponse:
      type: object
      properties:
        deviceId:
          $ref: "#/components/schemas/UUID"
        deviceToken:
          type: string
        familyCode:
          type: string
      required:
        - deviceId
        - deviceToken
        - familyCode
      additionalProperties: false
    DeviceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeviceView"
      required:
        - items
      additionalProperties: false
    DeviceView:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        deviceName:
          type: string
        createdAt:
          $ref: "#/components/schemas/Rfc3339DateTime"
        lastUsedAt:
          $ref: "#/components/schemas/Rfc3339DateTime"
        isCurrent:
          type: boolean
      required:
        - id
        - deviceName
        - createdAt
        - lastUsedAt
        - isCurrent
      additionalProperties: false
    LogoutResponse:
      type: object
      properties:
        revoked:
          type: boolean
          const: true
      required:
        - revoked
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        familyCode:
          type: string
          minLength: 1
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - familyCode
        - deviceName
      additionalProperties: false
    RegisterResponse:
      type: object
      properties:
        deviceId:
          $ref: "#/components/schemas/UUID"
        deviceToken:
          type: string
      required:
        - deviceId
        - deviceToken
      additionalProperties: false
    RevokeDeviceResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        revoked:
          type: boolean
          const: true
      required:
        - id
        - revoked
      additionalProperties: false
    RotateFamilyCodeResponse:
      type: object
      properties:
        familyCode:
          type: string
      required:
        - familyCode
      additionalProperties: false
    ChatHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          maxItems: 40
      required:
        - messages
      additionalProperties: false
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        chatRequestId:
          $ref: "#/components/schemas/UUID"
        createdAt:
          $ref: "#/components/schemas/Rfc3339DateTime"
      required:
        - role
        - content
        - chatRequestId
        - createdAt
      additionalProperties: false
    ChatRequest:
      type: object
      properties:
        chatRequestId:
          $ref: "#/components/schemas/UUID"
        modelId:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 10000
      required:
        - chatRequestId
        - modelId
        - message
      additionalProperties: false
    SseConfirmationRequiredEvent:
      $ref: "#/components/schemas/ConfirmationEventDto"
    SseDeltaEvent:
      type: object
      properties:
        text:
          type: string
      required:
        - text
      additionalProperties: false
    SseDoneEvent:
      type: object
      properties:
        chatRequestId:
          $ref: "#/components/schemas/UUID"
      required:
        - chatRequestId
      additionalProperties: false
    SseErrorEvent:
      type: object
      properties:
        errCode:
          type: string
        errMessage:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
          minLength: 1
      required:
        - errCode
        - errMessage
        - retryable
        - requestId
      additionalProperties: false
    SseStartEvent:
      type: object
      properties:
        chatRequestId:
          $ref: "#/components/schemas/UUID"
        replayed:
          type: boolean
        resumed:
          type: boolean
      required:
        - chatRequestId
        - replayed
        - resumed
      additionalProperties: false
    SseToolStatusEvent:
      type: object
      properties:
        toolCallId:
          type: string
        toolName:
          type: string
        status:
          type: string
          enum:
            - started
            - succeeded
            - failed
        replayed:
          type: boolean
      required:
        - toolCallId
        - toolName
        - status
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        errCode:
          type: string
        errMessage:
          type: string
        requestId:
          type: string
          minLength: 1
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
            required:
              - reason
            additionalProperties: false
      required:
        - success
        - errCode
        - errMessage
        - requestId
        - retryable
      additionalProperties: false
    HealthLiveResponse:
      type: object
      properties:
        status:
          const: ok
      required:
        - status
      additionalProperties: false
    HealthNotReadyResponse:
      type: object
      properties:
        status:
          const: not ready
        reason:
          type: string
      required:
        - status
      additionalProperties: false
    HealthReadyResponse:
      type: object
      properties:
        status:
          const: ready
      required:
        - status
      additionalProperties: false
    IsoDate:
      type: string
      format: date
      description: ISO 日期 YYYY-MM-DD
    MealType:
      type: string
      enum:
        - breakfast
        - lunch
        - dinner
      description: 餐次类型
    MondayDate:
      type: string
      format: date
      description: 必须是周一的 ISO 日期
    Rfc3339DateTime:
      type: string
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?(?:Z|\+00:00)$
      description: UTC RFC 3339 时间戳，仅接受 Z 或 +00:00 零 offset
    ServerVersion:
      type: string
      pattern: ^[1-9][0-9]*$
      description: 服务端版本号，正整数十进制字符串，上限 9223372036854775807
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data: {}
      required:
        - success
        - data
      additionalProperties: false
    UUID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: 小写 canonical UUID 格式
