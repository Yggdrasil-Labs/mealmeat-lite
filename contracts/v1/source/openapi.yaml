x-mealmate-invariants:
  - id: WEEK_START_IS_MONDAY
    appliesTo: [WeeklyPlanView, GenerateWeeklyPlanInput]
    owners: [server, android, database]
    vectors:
      valid: ["2026-07-27"]
      invalid: ["2026-07-26", "not-a-date"]
  - id: WEEKLY_PLAN_HAS_21_SLOTS
    appliesTo: [WeeklyPlanView, GenerateWeeklyPlanInput]
    owners: [server, android]
    vectors:
      valid:
        - items: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]
      invalid:
        - items: []
        - 21
        - items: 21
  - id: SYNC_RESULTS_PRESERVE_INPUT_ORDER
    appliesTo: [SyncActionsResponse]
    owners: [server, android]
    vectors:
      valid:
        - inputActionIds: ["a", "b"]
          resultActionIds: ["a", "b"]
      invalid:
        - inputActionIds: ["a", "b"]
          resultActionIds: ["b", "a"]
        - inputActionIds: ["a"]
          resultActionIds: ["a", "b"]
  - id: SERVER_VERSION_WITHIN_DB_BIGINT
    appliesTo: [ServerVersion]
    owners: [server, android, database]
    vectors:
      valid: ["1", "9223372036854775807"]
      invalid: ["0", "9223372036854775808", "01"]
  - id: CONFIRMATION_STATE_FIELDS_MATCH
    appliesTo: [ConfirmationEventDto]
    owners: [server, android]
    vectors:
      valid:
        - state: pending
          confirmationToken: token-1
        - state: expired
      invalid:
        - state: pending
        - state: consumed
          confirmationToken: token-1
        - state: unknown
