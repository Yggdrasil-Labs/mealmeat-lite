openapi: 3.1.0
info:
  title: MealMate Lite API
  version: 0.1.0
  description: AI 对话驱动的家庭饮食规划 API

servers:
  - url: /

paths:
  /health/live:
    get:
      operationId: healthLive
      summary: 存活检查
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: schemas/common.schema.json#/$defs/HealthLiveResponse

  /health/ready:
    get:
      operationId: healthReady
      summary: 就绪检查
      responses:
        '200':
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: schemas/common.schema.json#/$defs/HealthReadyResponse
        '503':
          description: 服务未就绪
          content:
            application/json:
              schema:
                $ref: schemas/common.schema.json#/$defs/HealthNotReadyResponse

  /api/v1/chat:
    post:
      operationId: chat
      summary: 发送聊天消息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/chat.schema.json#/$defs/ChatRequest
      responses:
        '200':
          description: SSE 流式响应
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/chat/history:
    get:
      operationId: getChatHistory
      summary: 获取对话历史
      responses:
        '200':
          description: 对话历史
          content:
            application/json:
              schema:
                $ref: schemas/chat.schema.json#/$defs/ChatHistoryResponse

  /api/v1/recipes:
    get:
      operationId: listRecipes
      summary: 列出菜品
      responses:
        '200':
          description: 菜品列表
          content:
            application/json:
              schema:
                $ref: schemas/recipe.schema.json#/$defs/RecipeListResponse

  /api/v1/recipes/{id}:
    patch:
      operationId: patchRecipe
      summary: 更新菜品
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/recipe.schema.json#/$defs/RecipePatchRequest
      responses:
        '200':
          description: 更新后的菜品
          content:
            application/json:
              schema:
                $ref: schemas/recipe.schema.json#/$defs/RecipeView
    delete:
      operationId: deleteRecipe
      summary: 删除菜品
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: schemas/recipe.schema.json#/$defs/RecipeTombstone

  /api/v1/plans/current:
    get:
      operationId: getCurrentPlan
      summary: 获取本周计划
      responses:
        '200':
          description: 本周计划
          content:
            application/json:
              schema:
                $ref: schemas/plan.schema.json#/$defs/CurrentWeeklyPlanResponse

  /api/v1/plans/{weekStart}:
    get:
      operationId: getPlanByWeek
      summary: 获取指定周计划
      parameters:
        - name: weekStart
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 周计划
          content:
            application/json:
              schema:
                $ref: schemas/plan.schema.json#/$defs/WeeklyPlanView

  /api/v1/settings:
    get:
      operationId: getSettings
      summary: 获取设置
      responses:
        '200':
          description: 设置
          content:
            application/json:
              schema:
                $ref: schemas/settings.schema.json#/$defs/SettingsResponse
    put:
      operationId: updateSettings
      summary: 更新设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/settings.schema.json#/$defs/SettingsUpdateRequest
      responses:
        '200':
          description: 更新后的设置
          content:
            application/json:
              schema:
                $ref: schemas/settings.schema.json#/$defs/SettingsResponse

  /api/v1/models:
    get:
      operationId: listModels
      summary: 列出可用模型
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: schemas/settings.schema.json#/$defs/ModelListResponse

  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      summary: 初始化实例
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/auth.schema.json#/$defs/BootstrapRequest
      responses:
        '200':
          description: 初始化结果
          content:
            application/json:
              schema:
                $ref: schemas/auth.schema.json#/$defs/BootstrapResponse

  /api/v1/auth/register:
    post:
      operationId: register
      summary: 注册设备
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/auth.schema.json#/$defs/RegisterRequest
      responses:
        '200':
          description: 注册结果
          content:
            application/json:
              schema:
                $ref: schemas/auth.schema.json#/$defs/RegisterResponse

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前设备
      responses:
        '200':
          description: 注销结果
          content:
            application/json:
              schema:
                $ref: schemas/auth.schema.json#/$defs/LogoutResponse

  /api/v1/auth/devices:
    get:
      operationId: listDevices
      summary: 列出已注册设备
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                $ref: schemas/auth.schema.json#/$defs/DeviceListResponse

  /api/v1/auth/devices/{id}:
    delete:
      operationId: revokeDevice
      summary: 撤销设备
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 撤销结果
          content:
            application/json:
              schema:
                $ref: schemas/auth.schema.json#/$defs/RevokeDeviceResponse

  /api/v1/auth/family-code/rotate:
    post:
      operationId: rotateFamilyCode
      summary: 轮换家庭码
      responses:
        '200':
          description: 新家庭码
          content:
            application/json:
              schema:
                $ref: schemas/auth.schema.json#/$defs/RotateFamilyCodeResponse

  /api/v1/confirmations/commit:
    post:
      operationId: commitConfirmation
      summary: 提交确认
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/sync.schema.json#/$defs/ConfirmationCommitRequest
      responses:
        '200':
          description: 提交结果
          content:
            application/json:
              schema:
                $ref: schemas/sync.schema.json#/$defs/ConfirmationCommitResultDto

  /api/v1/sync:
    get:
      operationId: sync
      summary: 增量同步
      responses:
        '200':
          description: 同步变更
          content:
            application/json:
              schema:
                $ref: schemas/sync.schema.json#/$defs/SyncResponse

  /api/v1/sync/actions:
    post:
      operationId: syncActions
      summary: 上传离线动作
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/sync.schema.json#/$defs/SyncActionsRequest
      responses:
        '200':
          description: 动作结果
          content:
            application/json:
              schema:
                $ref: schemas/sync.schema.json#/$defs/SyncActionsResponse

# ============================================================================
# x-mealmate 扩展
# ============================================================================

x-mealmate-functions:
  - name: add_recipe
    description: 添加菜品
    inputSchemaId: AddRecipeInput
    outputSchemaId: AddRecipeOutput
  - name: update_recipe
    description: 更新菜品
    inputSchemaId: UpdateRecipeInput
    outputSchemaId: UpdateRecipeOutput
  - name: delete_recipe
    description: 删除菜品
    inputSchemaId: DeleteRecipeInput
    outputSchemaId: DeleteRecipeOutput
  - name: restore_recipe
    description: 恢复已删除菜品
    inputSchemaId: RestoreRecipeInput
    outputSchemaId: RestoreRecipeOutput
  - name: search_recipes
    description: 搜索菜品
    inputSchemaId: SearchRecipesInput
    outputSchemaId: SearchRecipesOutput
  - name: batch_generate_recipes
    description: 批量生成菜品
    inputSchemaId: BatchGenerateRecipesInput
    outputSchemaId: BatchGenerateRecipesOutput
  - name: generate_weekly_plan
    description: 生成周计划
    inputSchemaId: GenerateWeeklyPlanInput
    outputSchemaId: GenerateWeeklyPlanOutput
  - name: update_plan_item
    description: 更新餐次
    inputSchemaId: UpdatePlanItemInput
    outputSchemaId: UpdatePlanItemOutput

x-mealmate-sse:
  - event: start
    schemaId: SseStartEvent
    isStart: true
    isTerminal: false
    nextEvents: [delta, tool-status, confirmation-required, error, done]
    mutuallyExclusiveDataFields: [replayed, resumed]
  - event: delta
    schemaId: SseDeltaEvent
    isStart: false
    isTerminal: false
    nextEvents: [delta, tool-status, confirmation-required, error, done]
  - event: tool-status
    schemaId: SseToolStatusEvent
    isStart: false
    isTerminal: false
    nextEvents: [delta, tool-status, confirmation-required, error, done]
    toolLifecycle:
      idField: toolCallId
      statusField: status
      startedStatus: started
      terminalStatuses: [succeeded, failed]
  - event: confirmation-required
    schemaId: SseConfirmationRequiredEvent
    isStart: false
    isTerminal: false
    nextEvents: [delta, tool-status, confirmation-required, error, done]
    confirmationToken:
      stateField: state
      tokenField: confirmationToken
      tokenRequiredState: pending
      tokenForbiddenStates: [expired, superseded, consumed]
  - event: error
    schemaId: SseErrorEvent
    isStart: false
    isTerminal: true
    nextEvents: []
    errorCatalog:
      errCodeField: errCode
      retryableField: retryable
      requestIdField: requestId
  - event: done
    schemaId: SseDoneEvent
    isStart: false
    isTerminal: true
    nextEvents: []

x-mealmate-errors:
  - errCode: BAD_REQUEST
    httpStatus: 400
    retryable: false
    retryAfter: { kind: none }
    channels: [json, sse]
