name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: matrix.language != 'java-kotlin'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Stable CodeQL 2.26.1 cannot extract Kotlin 2.4.10. Remove this
      # temporary workaround once CodeQL 2.26.2 or later is recommended.
      - name: Initialize CodeQL (Kotlin nightly compatibility)
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: nightly

      # CodeQL must initialize before Gradle so it can observe Java/Kotlin compilation.
      - name: Set up mise
        if: matrix.build-mode == 'manual'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Set up Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Provision Android SDK
        if: matrix.build-mode == 'manual'
        run: mise exec -- bash app/scripts/provision-android-sdk.sh

      - name: Build Android app for CodeQL
        if: matrix.build-mode == 'manual'
        working-directory: app
        run: mise exec -- ./gradlew --no-daemon --no-build-cache clean :app:assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@v4
