name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Server — TypeScript + Hono 后端
  # ============================================================
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: mealmate
          POSTGRES_USER: mealmate
          POSTGRES_PASSWORD: mealmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mealmate -d mealmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: mise exec -- corepack pnpm install --frozen-lockfile

      - name: Contract generation check
        run: mise exec -- corepack pnpm contract:check

      - name: Migration artifact check
        run: mise exec -- corepack pnpm db:migrations:check
        env:
          DB_PASSWORD: contract_generation

      - name: Lint (Biome)
        run: mise exec -- corepack pnpm lint

      - name: Type check
        run: mise exec -- corepack pnpm typecheck

      - name: Unit tests
        run: mise exec -- corepack pnpm test:unit
        env:
          NODE_ENV: test

      - name: Integration tests
        run: mise exec -- corepack pnpm test:integration
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mealmate
          DB_USER: mealmate
          DB_PASSWORD: mealmate_test

      - name: Contract v1 final gate
        run: mise exec -- corepack pnpm contract:final-gate

  # ============================================================
  # App — Android Kotlin + Compose
  # ============================================================
  app:
    # Keep the Android runner family stable; the SDK provisioning below is
    # still the source of truth for the managed-device toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Provision Android SDK
        run: mise exec -- bash ./scripts/provision-android-sdk.sh

      - name: Provisioning script regression test
        run: bash ./scripts/test-provision-android-sdk.sh

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Contract model freshness
        run: mise exec -- ./gradlew :app:checkContractModels

      - name: Contract stale-file negative test
        run: bash ./scripts/test-check-contract-models.sh

      - name: ktlint check
        run: mise exec -- ./gradlew --refresh-dependencies --info --stacktrace ktlintCheck

      - name: detekt
        run: mise exec -- ./gradlew detekt

      - name: Lint (Android)
        run: mise exec -- ./gradlew :app:lintDebug

      - name: Kotlin contract and Room unit tests
        run: mise exec -- ./gradlew :app:testDebugUnitTest

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Room managed device tests
        # AGP provisions missing system images during each device task. Keep
        # those SDK writes serialized to avoid corrupting shared installations
        # when two local devices are requested in the same Gradle invocation.
        run: |
          mise exec -- bash ./scripts/run-managed-device-tests.sh ./gradlew --no-parallel -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect pixel2Api27DebugAndroidTest
          mise exec -- bash ./scripts/run-managed-device-tests.sh ./gradlew --no-parallel -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect pixel6Api37DebugAndroidTest

  # ============================================================
  # Docker Compose — 编排语法验证 + 镜像构建
  # ============================================================
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Create dummy .env for Compose validation
        run: |
          printf '%s\n' \
            'DB_NAME=mealmate' \
            'DB_USER=mealmate' \
            'MEALMATE_DB_PASSWORD_FILE=/dev/null' \
            'MEALMATE_BOOTSTRAP_SECRET_FILE=/dev/null' \
            'MEALMATE_MODELS_FILE=/dev/null' \
            'MEALMATE_PUBLIC_DOMAIN=localhost' \
            'MEALMATE_PROVIDER_ENV_FILE=/dev/null' \
            > .env

      - name: Validate Compose config (production)
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Compose config (test overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

      - name: Build migrate image
        run: docker compose -f docker-compose.yml build migrate

      - name: Build app image
        run: docker compose -f docker-compose.yml build app

      - name: Build Caddy health-probe image
        run: docker compose -f docker-compose.yml build caddy

      - name: Compose runtime smoke with scripted provider (no real provider)
        shell: bash
        run: |
          set -euo pipefail

          smoke_dir="${RUNNER_TEMP}/mealmate-compose-smoke"
          mkdir -p "$smoke_dir"
          openssl rand -hex 16 > "$smoke_dir/db-password"
          openssl rand -hex 32 > "$smoke_dir/bootstrap-secret"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$smoke_dir/provider.key" \
            -out "$smoke_dir/provider.crt" \
            -days 1 \
            -subj '/CN=provider-mock' \
            -addext 'subjectAltName=DNS:provider-mock'
          chmod 600 "$smoke_dir/provider.key"
          chmod 644 "$smoke_dir/provider.crt"

          printf '%s\n' 'CI_PROVIDER_API_KEY=ci-no-real-provider' > "$smoke_dir/provider.env"

          printf '%s\n' \
            '{' \
            '  "models": [' \
            '    {' \
            '      "id": "ci-smoke",' \
            '      "displayName": "CI smoke provider",' \
            '      "baseURL": "https://provider-mock:8443/v1",' \
            '      "model": "ci-smoke-model",' \
            '      "apiKeyEnv": "CI_PROVIDER_API_KEY",' \
            '      "enabled": true,' \
            '      "isDefault": true,' \
            '      "capabilities": { "streaming": true, "tools": true }' \
            '    }' \
            '  ]' \
            '}' > "$smoke_dir/models.json"

          printf '%s\n' \
            "DB_NAME=mealmate" \
            "DB_USER=mealmate" \
            "MEALMATE_DB_PASSWORD_FILE=$smoke_dir/db-password" \
            "MEALMATE_BOOTSTRAP_SECRET_FILE=$smoke_dir/bootstrap-secret" \
            "MEALMATE_MODELS_FILE=$smoke_dir/models.json" \
            "MEALMATE_PUBLIC_DOMAIN=localhost" \
            "MEALMATE_PROVIDER_ENV_FILE=$smoke_dir/provider.env" \
            "MEALMATE_PROVIDER_CA_FILE=$smoke_dir/provider.crt" \
            'MEALMATE_PROVIDER_CA_CERT_PATH=/run/provider/provider-ca.crt' \
            "MEALMATE_SMOKE_PROVIDER_CERT_FILE=$smoke_dir/provider.crt" \
            "MEALMATE_SMOKE_PROVIDER_KEY_FILE=$smoke_dir/provider.key" \
            "MEALMATE_SMOKE_PROVIDER_UID=$(id -u)" \
            "MEALMATE_SMOKE_PROVIDER_GID=$(id -g)" \
            > .env

          compose=(docker compose --env-file .env -f docker-compose.yml --profile production --profile smoke)
          cleanup() {
            "${compose[@]}" down --volumes --remove-orphans
          }
          trap cleanup EXIT

          "${compose[@]}" up --build --wait
          curl --fail --silent --show-error http://127.0.0.1/health/live
          curl --fail --silent --show-error --insecure --resolve localhost:443:127.0.0.1 https://localhost/health/ready
          curl --fail --silent --show-error --insecure --resolve localhost:443:127.0.0.1 https://localhost/
          "${compose[@]}" exec -T app node dist/cli.js models verify
          provider_payload=$("${compose[@]}" exec -T provider-mock cat /tmp/provider-requested)
          case "$provider_payload" in
            *'"model":"ci-smoke-model"'*'"stream":true'*'"tools":'*) ;;
            *)
              echo 'Provider smoke did not receive the expected app probe request.' >&2
              exit 1
              ;;
          esac
