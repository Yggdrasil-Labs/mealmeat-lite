name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Server — TypeScript + Hono 后端
  # ============================================================
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: mealmate
          POSTGRES_USER: mealmate
          POSTGRES_PASSWORD: mealmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mealmate -d mealmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: mise exec -- corepack pnpm install --frozen-lockfile

      - name: Contract generation check
        run: mise exec -- corepack pnpm contract:check

      - name: Migration artifact check
        run: mise exec -- corepack pnpm db:migrations:check
        env:
          DB_PASSWORD: contract_generation

      - name: Lint (Biome)
        run: mise exec -- corepack pnpm lint

      - name: Type check
        run: mise exec -- corepack pnpm typecheck

      - name: Unit tests
        run: mise exec -- corepack pnpm test:unit
        env:
          NODE_ENV: test

      - name: Integration tests
        run: mise exec -- corepack pnpm test:integration
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mealmate
          DB_USER: mealmate
          DB_PASSWORD: mealmate_test

      - name: Contract v1 final gate
        run: mise exec -- corepack pnpm contract:final-gate

  # ============================================================
  # App — Android Kotlin + Compose
  # ============================================================
  app:
    # Keep the Android runner family stable; the SDK provisioning below is
    # still the source of truth for the managed-device toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Provision Android SDK
        run: mise exec -- bash ./scripts/provision-android-sdk.sh

      - name: Provisioning script regression test
        run: bash ./scripts/test-provision-android-sdk.sh

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Contract model freshness
        run: mise exec -- ./gradlew :app:checkContractModels

      - name: Contract stale-file negative test
        run: bash ./scripts/test-check-contract-models.sh

      - name: ktlint check
        run: mise exec -- ./gradlew --refresh-dependencies --info --stacktrace ktlintCheck

      - name: detekt
        run: mise exec -- ./gradlew detekt

      - name: Lint (Android)
        run: mise exec -- ./gradlew :app:lintDebug

      - name: Kotlin contract and Room unit tests
        run: mise exec -- ./gradlew :app:testDebugUnitTest

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Room managed device tests
        # AGP provisions missing system images during each device task. Keep
        # those SDK writes serialized to avoid corrupting shared installations
        # when two local devices are requested in the same Gradle invocation.
        run: |
          mise exec -- bash ./scripts/run-managed-device-tests.sh ./gradlew --no-parallel -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect pixel2Api27DebugAndroidTest
          mise exec -- bash ./scripts/run-managed-device-tests.sh ./gradlew --no-parallel -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect pixel6Api37DebugAndroidTest

  # ============================================================
  # Docker Compose — 编排语法验证 + 镜像构建
  # ============================================================
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Create dummy .env for Compose validation
        run: |
          printf '%s\n' \
            'DB_NAME=mealmate' \
            'DB_USER=mealmate' \
            'MEALMATE_DB_PASSWORD_FILE=/dev/null' \
            'MEALMATE_BOOTSTRAP_SECRET_FILE=/dev/null' \
            'MEALMATE_MODELS_FILE=/dev/null' \
            'MEALMATE_PUBLIC_DOMAIN=localhost' \
            > .env

      - name: Validate Compose config (production)
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Compose config (test overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

      - name: Build migrate image
        run: docker compose -f docker-compose.yml build migrate

      - name: Build app image
        run: docker compose -f docker-compose.yml build app

      - name: Build Caddy health-probe image
        run: docker compose -f docker-compose.yml build caddy
